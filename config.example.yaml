# Copy to config.yaml and set guild_id / operators before `docker compose up`.
# Remotes are normally registered via /herdr in Discord (host, port, token, TLS fingerprint).

discord:
  token: "${DISCORD_TOKEN}"
  guild_id: 0          # replace with your Discord server ID
  home_channel_id: 0   # optional: channel for ready / reconnect alerts

operators:
  require_manage_guild: true
  user_ids: []         # optional allowlist; empty = any admin/role match
  role_ids: []         # Discord role IDs that count as operator

bridge:
  category_prefix: "remote:"
  terminal:
    max_lines: 50
    edit_cooldown: 2.0
    poll_interval: 2.0
  status_emoji:
    idle: "🟢"
    working: "🔵"
    blocked: "🔴"
    done: "✅"
    shell: "⚪"
    unknown: "❓"
  sync_interval: 300
  read_only: false

# Optional one-time seeds for cache/remotes.json on first run (registry wins afterwards).
# seed_remotes:
#   - id: example-host
#     host: 192.168.1.10
#     port: 8787
#     token: "${GATEWAY_TOKEN}"
#     fingerprint: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
